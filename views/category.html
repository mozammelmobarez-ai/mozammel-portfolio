<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - Portfolio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Custom Cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- ===== NAV ===== -->
  <nav id="navbar">
    <div class="nav-logo"></div>
    <ul class="nav-links" id="navLinks">
      <li><a href="/#about">About</a></li>
      <li><a href="/#skills">Skills</a></li>
      <li><a href="/#experience">Experience</a></li>
      <li><a href="/#work">Work</a></li>
      <li><a href="/#contact" class="nav-cta">Contact Me</a></li>
    </ul>
    <div class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="container subpage-container">

    <!-- Back Button -->
    <a href="/" class="category-back-btn">← Back to Home</a>

    <!-- Category Header -->
    <div class="category-header">
      <h1 id="categoryTitle">Loading...</h1>
      <p id="categoryDesc"></p>
    </div>

    <!-- Projects Grid -->
    <div id="projectsContainer" class="category-spinner-wrap">
      <div class="category-spinner"></div>
      <p>Loading projects...</p>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
      <div class="container footer-inner">
        <div class="nav-logo"></div>
        <p>© 2026 Mozammel Mobarez. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Custom Context Menu -->
  <div id="contextMenu" class="context-menu"></div>

  <script src="/script.js"></script>
  <script>
    let categoryId = null;
    let projects = [];

    document.addEventListener('DOMContentLoaded', () => {
      // Get category ID from URL
      const pathParts = window.location.pathname.split('/');
      categoryId = pathParts[pathParts.length - 1];

      if (categoryId && categoryId !== '' && categoryId !== 'category') {
        loadCategoryData();
      } else {
        document.getElementById('projectsContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Category not found. <a href="/" style="color: var(--violet-light);">Return to home</a></p>';
      }
    });

    async function loadCategoryData() {
      try {
        // Load category info
        const catResponse = await fetch(`/api/categories/${categoryId}`);
        if (!catResponse.ok) throw new Error('Category not found');
        
        const category = await catResponse.json();
        document.getElementById('categoryTitle').textContent = category.name;
        document.getElementById('categoryDesc').textContent = category.description || '';

        // Load projects for this category
        const projResponse = await fetch(`/api/categories/${categoryId}/projects`);
        if (!projResponse.ok) throw new Error('Failed to load projects');

        projects = await projResponse.json();
        renderProjects();
      } catch (err) {
        console.error('Error loading category:', err);
        document.getElementById('projectsContainer').innerHTML = `<p style="text-align: center; color: var(--pink);">${err.message}</p>`;
      }
    }

    function renderProjects() {
      const container = document.getElementById('projectsContainer');

      if (projects.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0;">No projects in this category yet</p>';
        return;
      }

      container.className = 'projects-grid';
      container.innerHTML = projects.map((proj) => {
        let thumb = '';
        if (proj.content_type === 'image') {
          thumb = `<img src="${proj.preview_url || proj.media_url}" alt="${proj.title}">`;
        } else if (proj.content_type === 'video') {
          const videoThumb = proj.preview_url || '';
          thumb = `<img src="${videoThumb}" alt="${proj.title}" style="display: ${videoThumb ? 'block' : 'none'};"><div class="project-thumb-overlay" style="opacity: 1;"><div class="play-icon">▶</div></div>`;
        } else if (proj.content_type === 'link') {
          if (proj.preview_url) {
            thumb = `<img src="${proj.preview_url}" alt="${proj.title}"><div class="project-thumb-overlay" style="opacity: 1;"><div class="play-icon" style="font-size: 1.5rem;">🔗</div></div>`;
          } else {
            thumb = `<div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"><div style="text-align: center; color: var(--violet); font-size: 48px;">🔗</div></div>`;
          }
        }

        return `
          <div class="project-card" onclick="window.location.href = '/project/${proj.id}'">
            <div class="project-thumb">
              ${thumb}
            </div>
            <div class="project-info">
              <h3>${proj.title}</h3>
              <p>${proj.description || 'No description'}</p>
              <span class="project-type">${proj.content_type}</span>
            </div>
          </div>
        `;
      }).join('');

      // Re-setup hover cursor for newly loaded cards
      if (typeof setupCursorHover === 'function') {
        setupCursorHover();
      }
    }
  </script>
</body>
</html>
