<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - Portfolio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Custom Cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <div class="container">
    <!-- Navigation -->
    <nav id="navbar" style="position: relative; background: transparent; border-bottom: 1px solid var(--border); margin-bottom: 3rem;">
      <a href="/" class="nav-logo" style="text-decoration: none;">Portfolio</a>
      <ul class="nav-links" style="display: flex;">
        <li><a href="/">Home</a></li>
        <li><a href="/#work">Projects</a></li>
        <li><a href="/#contact" class="nav-cta">Contact Me</a></li>
      </ul>
    </nav>

    <!-- Back Button -->
    <a href="/" class="category-back-btn">← Back to Home</a>

    <!-- Category Header -->
    <div class="category-header">
      <h1 id="categoryTitle">Loading...</h1>
      <p id="categoryDesc"></p>
    </div>

    <!-- Projects Grid -->
    <div id="projectsContainer" class="category-spinner-wrap">
      <div class="category-spinner"></div>
      <p>Loading projects...</p>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 6rem;">
      <div class="footer-inner">
        <div class="nav-logo">Portfolio</div>
        <p>&copy; 2026 Mozammel Mobarez. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script>
    // Custom Cursor Logic
    const customCursor = document.getElementById('customCursor');
    document.addEventListener('mousemove', (e) => {
      if (customCursor) {
        customCursor.style.left = e.clientX + 'px';
        customCursor.style.top = e.clientY + 'px';
      }
    });

    const setupCursorHover = () => {
      const interactiveElements = document.querySelectorAll('a, button, input, textarea, .project-card');
      interactiveElements.forEach(el => {
        el.addEventListener('mouseenter', () => {
          if (customCursor) customCursor.classList.add('hovering');
        });
        el.addEventListener('mouseleave', () => {
          if (customCursor) customCursor.classList.remove('hovering');
        });
      });
    };

    document.addEventListener('mousedown', () => {
      if (customCursor) customCursor.classList.add('clicking');
    });

    document.addEventListener('mouseup', () => {
      if (customCursor) customCursor.classList.remove('clicking');
    });

    let categoryId = null;
    let projects = [];

    document.addEventListener('DOMContentLoaded', () => {
      setupCursorHover();

      // Get category ID from URL
      const pathParts = window.location.pathname.split('/');
      categoryId = pathParts[pathParts.length - 1];

      if (categoryId && categoryId !== '' && categoryId !== 'category') {
        loadCategoryData();
      } else {
        document.getElementById('projectsContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Category not found. <a href="/" style="color: var(--violet-light);">Return to home</a></p>';
      }
    });

    async function loadCategoryData() {
      try {
        // Load category info
        const catResponse = await fetch(`/api/categories/${categoryId}`);
        if (!catResponse.ok) throw new Error('Category not found');
        
        const category = await catResponse.json();
        document.getElementById('categoryTitle').textContent = category.name;
        document.getElementById('categoryDesc').textContent = category.description || '';

        // Load projects for this category
        const projResponse = await fetch(`/api/categories/${categoryId}/projects`);
        if (!projResponse.ok) throw new Error('Failed to load projects');

        projects = await projResponse.json();
        renderProjects();
      } catch (err) {
        console.error('Error loading category:', err);
        document.getElementById('projectsContainer').innerHTML = `<p style="text-align: center; color: var(--pink);">${err.message}</p>`;
      }
    }

    function renderProjects() {
      const container = document.getElementById('projectsContainer');

      if (projects.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0;">No projects in this category yet</p>';
        return;
      }

      container.className = 'projects-grid';
      container.innerHTML = projects.map((proj) => {
        const previewSrc = proj.preview_url || proj.media_url;
        let thumb = '';
        if (proj.content_type === 'image') {
          thumb = `<img src="${previewSrc}" alt="${proj.title}">`;
        } else if (proj.content_type === 'video') {
          thumb = `<video muted preload="metadata" playsinline><source src="${previewSrc}" type="video/mp4"></video><div class="project-thumb-overlay"><div class="play-icon">▶</div></div>`;
        } else if (proj.content_type === 'link') {
          thumb = `<div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"><div style="text-align: center; color: var(--violet); font-size: 48px;">🔗</div></div>`;
        }

        return `
          <div class="project-card" onclick="window.location.href = '/project/${proj.id}'">
            <div class="project-thumb">
              ${thumb}
            </div>
            <div class="project-info">
              <h3>${proj.title}</h3>
              <p>${proj.description || 'No description'}</p>
              <span class="project-type">${proj.content_type}</span>
            </div>
          </div>
        `;
      }).join('');

      // Re-setup hover cursor for newly loaded cards
      setupCursorHover();
    }
  </script>

  <!-- Custom Context Menu -->
  <div id="contextMenu" class="context-menu"></div>

  <script>
    const contextMenu = document.getElementById('contextMenu');

    document.addEventListener('contextmenu', (e) => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();

      const projectCard = e.target.closest('.project-card');
      if (projectCard) {
        const onclick = projectCard.getAttribute('onclick');
        const match = onclick && onclick.match(/\/project\/(\d+)/);
        if (match) {
          const projTitle = projectCard.querySelector('h3')?.textContent || 'Project';
          contextMenu.innerHTML = `
            <span class="context-menu-item" style="opacity:0.5; pointer-events:none; font-size:0.75rem;">${projTitle}</span>
            <a href="${match[0]}" class="context-menu-item">View Project</a>
            <button class="context-menu-item" style="background:transparent; border:none; color:var(--text); width:100%; text-align:left; cursor:pointer;" onclick="navigator.clipboard.writeText('${window.location.origin}${match[0]}'); contextMenu.style.display='none';">Copy Link</button>
          `;
        }
      } else {
        contextMenu.innerHTML = `
          <a href="/" class="context-menu-item">Home</a>
          <a href="/#work" class="context-menu-item">All Projects</a>
          <a href="/#contact" class="context-menu-item context-menu-cta">Contact Me</a>
        `;
      }

      showContextMenu(e.clientX, e.clientY);
    });

    function showContextMenu(x, y) {
      contextMenu.style.display = 'block';
      const menuWidth = contextMenu.offsetWidth;
      const menuHeight = contextMenu.offsetHeight;
      let posX = x, posY = y;
      if (x + menuWidth > window.innerWidth) posX = window.innerWidth - menuWidth - 10;
      if (y + menuHeight > window.innerHeight) posY = window.innerHeight - menuHeight - 10;
      contextMenu.style.left = posX + 'px';
      contextMenu.style.top = posY + 'px';
    }

    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none';
    });
    window.addEventListener('scroll', () => { contextMenu.style.display = 'none'; });
  </script>
</body>
</html>
